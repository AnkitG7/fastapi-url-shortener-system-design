# ======================================================
# docker-compose.yml — Full-Stack Scaled Architecture
# ======================================================
# SYSTEM DESIGN CONCEPT: Horizontal Scaling & High Availability
# -------------------------------------------------
# Architecture:
#
#                    [ Client Traffic ]
#                            |
#                            v
#                   [ Nginx Load Balancer ]
#                     (Port 80 -> Round Robin)
#                   /        |        \
#                  v         v         v
#             [App Replica 1] [App Replica 2] [App Replica 3]
#                  \         |         /
#                   +--------+--------+
#                   |                 |
#                   v                 v
#             [ PostgreSQL ]      [ Redis ]
#             (Durable DB)       (Cache & Rate Limit)
# ======================================================

services:
  # =====================================================
  # Nginx — Reverse Proxy & Load Balancer (Public Gateway)
  # =====================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: url_shortener_gateway
    ports:
      - "80:80"                  # Gateway exposed on port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_network

  # =====================================================
  # FastAPI Application — Stateless Scalable Cluster
  # =====================================================
  # SYSTEM DESIGN CONCEPT: Stateless Microservices
  # Scale to N replicas anytime with: `docker compose up --scale app=3 -d`
  # =====================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_NAME=url-shortener
      - DEBUG=false
      - BASE_URL=http://localhost
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/url_shortener
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_ANONYMOUS=10
      - RATE_LIMIT_FREE=100
      - RATE_LIMIT_PREMIUM=1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  # =====================================================
  # PostgreSQL — Primary Relational Database
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # =====================================================
  # Redis — In-Memory Cache & Sliding Window Rate Limiter
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
