# ======================================================
# docker-compose.yml — Local Infrastructure Services
# ======================================================
# SYSTEM DESIGN CONCEPT: Multi-Service Orchestration
# -------------------------------------------------
# We define both PostgreSQL (Relational DB) and Redis
# (In-Memory Cache) as isolated containerized services.
# ======================================================

services:
  # =====================================================
  # PostgreSQL — Primary Relational Database (Source of Truth)
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =====================================================
  # Redis — In-Memory Key-Value Cache & Fast Storage
  # =====================================================
  # SYSTEM DESIGN CONCEPT: In-Memory Caching
  # -------------------------------------------------
  # Disk I/O (PostgreSQL) is measured in MILLISECONDS (~1-10ms).
  # RAM I/O (Redis) is measured in MICROSECONDS (~100-500µs).
  #
  # By caching popular URLs in Redis:
  # 1. 10x-50x FASTER response times for redirects
  # 2. Reduces load on PostgreSQL by 80-95% (Pareto 80/20 rule)
  # 3. Protects the database from traffic spikes (Thundering Herd)
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # Enable AOF persistence for crash recovery
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
