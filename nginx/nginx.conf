# ======================================================
# nginx/nginx.conf — Reverse Proxy & Load Balancer
# ======================================================
# SYSTEM DESIGN CONCEPT: Reverse Proxy & Load Balancing
# -------------------------------------------------
# 1. WHAT IS A REVERSE PROXY?
#    A server that sits in front of web servers and forwards
#    client requests to those web servers.
#
# 2. BENEFITS:
#    - LOAD BALANCING: Distributes incoming requests across N
#      stateless FastAPI application instances.
#    - SECURITY & ISOLATION: Clients talk only to Nginx (Port 80);
#      application containers are hidden on internal Docker network.
#    - CLIENT BUFFERING: Nginx handles slow client connections (Slowloris attacks)
#      so FastAPI workers aren't tied up waiting on network packets.
#    - GZIP COMPRESSION: Compresses JSON responses at the edge, saving bandwidth.
# ======================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format including upstream response time and correlation ID
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_x_correlation_id":"$http_x_correlation_id"'
    '}';

    access_log /var/log/nginx/access.log main_json;
    error_log  /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json text/plain text/css application/xml;

    # ===================================================
    # UPSTREAM CLUSTER (Load Balancing Pool)
    # ===================================================
    # Docker's internal DNS automatically resolves the `app` service
    # name to all running container replica IP addresses.
    # ===================================================
    upstream fastapi_cluster {
        # Round Robin load balancing across all app replicas
        server app:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Max request body size (prevents giant payload DoS)
        client_max_body_size 10M;

        location / {
            proxy_pass http://fastapi_cluster;
            proxy_http_version 1.1;

            # Header propagation
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
